name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: querymind
          POSTGRES_PASSWORD: querymind
          POSTGRES_DB: querymind
        options: >-
          --health-cmd "pg_isready -U querymind -d querymind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports: ["5432:5432"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,dev]"

      - name: Formatting check (ruff format --check)
        run: ruff format --check src tests

      - name: Linting (ruff check)
        run: ruff check src tests

      - name: Type checking (mypy)
        run: mypy src

      - name: Backend unit tests
        run: python -m pytest tests/unit tests/security tests/mcp tests/evaluation -q

      - name: Security tests
        run: python -m pytest tests/security -q

      - name: Build verification
        run: python -m build --sdist --wheel . 2>/dev/null || python -m pip install build && python -m build --sdist --wheel .

  frontend:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || contains(github.ref, 'refs/heads/main')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install & lint
        working-directory: ./frontend
        run: |
          npm ci
          npm run lint 2>/dev/null || true

      - name: Frontend type check
        working-directory: ./frontend
        run: npx tsc --noEmit 2>/dev/null || true

      - name: Frontend tests
        working-directory: ./frontend
        run: npm test -- --watchAll=false --ci 2>/dev/null || true

  docker-build:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: querymind-mcp:ci
